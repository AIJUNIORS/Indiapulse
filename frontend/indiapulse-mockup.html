<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IndiaPulse — Category Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  /* Surfaces */
  --bg:#08090C;
  --panel:#0F1218;
  --panel-2:#141820;
  --panel-3:#191E28;
  --border:#1E2430;
  --border-subtle:#181D27;

  /* Text */
  --text:#ECEEF2;
  --text-dim:#8A93A8;
  --text-faint:#707A8C;

  /* Brand signals */
  --structure:#4E9BD8;
  --structure-glow:rgba(78,155,216,.12);
  --fundamental:#C9A24A;
  --fundamental-glow:rgba(201,162,74,.12);

  /* Semantic */
  --up:#3FB98A;
  --up-glow:rgba(63,185,138,.12);
  --down:#E0585F;
  --down-glow:rgba(224,88,95,.12);
  --warn:#D8A23D;
  --warn-glow:rgba(216,162,61,.12);

  /* Shape */
  --radius:10px;
  --radius-sm:7px;
  --radius-lg:14px;

  /* Shadow */
  --shadow-card:0 1px 3px rgba(0,0,0,.35), 0 4px 16px rgba(0,0,0,.22);
  --shadow-drawer:0 0 60px rgba(0,0,0,.6);

  /* Sidebar */
  --sidebar-w:224px;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*{box-sizing:border-box; margin:0; padding:0;}
html{ scroll-behavior:smooth; }
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  line-height:1.55;
  display:flex;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:600;
  letter-spacing:0.02em;
}
.mono{ font-family:'IBM Plex Mono',monospace; }

/* Scrollbar */
::-webkit-scrollbar{ width:5px; height:5px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:99px; }
::-webkit-scrollbar-thumb:hover{ background:#2A3040; }

/* ============================================================
   SIDEBAR
   ============================================================ */
#sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--panel);
  border-right:1px solid var(--border);
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* Brand */
.brand{
  padding:22px 20px 18px;
  border-bottom:1px solid var(--border);
}
.brand .display{
  font-size:23px;
  letter-spacing:0.03em;
  color:var(--text);
  line-height:1;
}
.brand .display span{
  color:var(--structure);
}
.brand .tag{
  font-size:10px;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:0.1em;
  margin-top:5px;
}

/* Nav */
.navlist{
  list-style:none;
  flex:1;
  overflow-y:auto;
  padding:10px 0;
}
.navlist li{ padding:1px 10px; }
.navlist a{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 11px;
  border-radius:var(--radius-sm);
  color:var(--text-dim);
  text-decoration:none;
  font-size:13px;
  font-weight:400;
  transition:background 0.12s, color 0.12s;
  position:relative;
}
.navlist a:hover{
  background:var(--panel-2);
  color:var(--text);
}
.navlist a.active{
  background:rgba(78,155,216,.1);
  color:var(--structure);
  font-weight:500;
}
.navlist a.active::before{
  content:'';
  position:absolute;
  left:0;
  top:50%;
  transform:translateY(-50%);
  width:2.5px;
  height:16px;
  background:var(--structure);
  border-radius:0 2px 2px 0;
}
.navlist .icon{
  width:18px;
  text-align:center;
  flex-shrink:0;
  opacity:.7;
  font-size:13px;
}
.navlist a.active .icon{ opacity:1; }
.navlist .count{
  margin-left:auto;
  font-size:10.5px;
  color:var(--text-faint);
  font-family:'IBM Plex Mono',monospace;
  background:var(--panel-2);
  padding:1px 6px;
  border-radius:99px;
  border:1px solid var(--border);
}
.navlist a.active .count{
  background:rgba(78,155,216,.1);
  border-color:rgba(78,155,216,.25);
  color:var(--structure);
}

.nav-section-label{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:0.09em;
  color:var(--text-faint);
  padding:14px 20px 5px;
  font-weight:600;
}

.sidebar-foot{
  padding:14px 20px;
  border-top:1px solid var(--border);
  font-size:10.5px;
  color:var(--text-faint);
  line-height:1.6;
}
.sidebar-foot .refresh-dot{
  display:inline-block;
  width:6px; height:6px;
  background:var(--up);
  border-radius:50%;
  margin-right:5px;
  vertical-align:middle;
  animation:pulse 2s infinite;
}

/* ============================================================
   MAIN AREA
   ============================================================ */
#main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

/* Topbar */
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(8,9,12,.88);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:12px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}
.topbar-left{
  display:flex;
  align-items:center;
  gap:6px;
  flex:1;
  min-width:0;
  overflow:hidden;
}
.crumb{
  color:var(--text-faint);
  font-size:12.5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.crumb b{ color:var(--text); font-weight:600; }
.crumb-sep{ color:var(--border); }
#refreshLabel{
  font-size:11px;
  color:var(--text-faint);
  opacity:.8;
}

.search-wrap{
  position:relative;
  flex-shrink:0;
}
.search-wrap::before{
  content:'⌕';
  position:absolute;
  left:10px;
  top:50%;
  transform:translateY(-50%);
  color:var(--text-faint);
  font-size:15px;
  pointer-events:none;
  line-height:1;
}
.search{
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:7px 12px 7px 30px;
  color:var(--text);
  font-size:12px;
  width:220px;
  transition:border-color .15s;
  font-family:inherit;
}
.search::placeholder{ color:var(--text-faint); }
.search:focus{
  outline:none;
  border-color:rgba(78,155,216,.4);
  box-shadow:0 0 0 3px rgba(78,155,216,.06);
}

/* Pages */
.page{ display:none; padding:26px 28px 72px; max-width:1440px; }
.page.active{ display:block; }

/* Page head */
.pagehead{ margin-bottom:24px; }
.pagehead h1{ font-size:28px; letter-spacing:0.01em; }
.pagehead p{
  color:var(--text-dim);
  font-size:13px;
  margin-top:4px;
  max-width:620px;
  line-height:1.6;
}

/* ============================================================
   GRID SYSTEM
   ============================================================ */
.grid{ display:grid; gap:12px; }
.cols-6{ grid-template-columns:repeat(6,1fr); }
.cols-4{ grid-template-columns:repeat(4,1fr); }
.cols-3{ grid-template-columns:repeat(3,1fr); }
.cols-2{ grid-template-columns:repeat(2,1fr); }
.cols-top{ grid-template-columns:2fr 1fr; align-items:start; }

@media (max-width:1100px){
  .cols-6{ grid-template-columns:repeat(3,1fr); }
  .cols-4{ grid-template-columns:repeat(2,1fr); }
}
@media (max-width:720px){
  .cols-3,.cols-2{ grid-template-columns:1fr; }
}

/* ============================================================
   CARD
   ============================================================ */
.card{
  background:var(--panel);
  border:1px solid #FFFFFF;
  border-radius:var(--radius);
  padding:16px;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow-card);
}
.card h3{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.07em;
  color:var(--text-faint);
  font-family:'Inter',sans-serif;
  font-weight:600;
  margin-bottom:7px;
}

/* Section title */
.section-title{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin:32px 0 10px;
}
.section-title h2{
  font-size:18px;
  letter-spacing:0.01em;
}
.section-title .sub{
  font-size:11.5px;
  color:var(--text-faint);
}
.section-title:first-child{ margin-top:0; }

/* Hero card */
.hero-card .val{
  font-size:26px;
  font-family:'IBM Plex Mono',monospace;
  font-weight:500;
  margin-top:2px;
  letter-spacing:-0.02em;
}
.hero-card .delta.up{ color:var(--up); }
.hero-card .delta.down{ color:var(--down); }
.hero-card .delta{ font-size:12px; margin-top:3px; }

/* Updated pulse */
.updated{ font-size:11px; color:var(--text-faint); margin-top:4px; }
.updated .dot.blue{ animation:pulse 2s infinite; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

/* ============================================================
   PILLS
   ============================================================ */
.pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:10px;
  padding:2px 9px;
  border-radius:99px;
  font-weight:600;
  letter-spacing:.04em;
  font-family:'Inter',sans-serif;
}
.pill.structure{
  background:var(--structure-glow);
  color:var(--structure);
  border:1px solid rgba(78,155,216,.25);
}
.pill.fundamental{
  background:var(--fundamental-glow);
  color:var(--fundamental);
  border:1px solid rgba(201,162,74,.25);
}
.pill.context{
  background:rgba(138,146,161,.1);
  color:var(--text-dim);
  border:1px solid var(--border);
}

/* Stars */
.stars{ color:var(--fundamental); letter-spacing:2px; font-size:13px; }
.stars .off{ color:#2C3240; }

/* ============================================================
   ALMANAC / CALENDAR
   ============================================================ */
.almanac-wrap{ overflow-x:auto; }
table.almanac{
  border-collapse:collapse;
  width:100%;
  font-size:12px;
}
table.almanac th{
  text-align:left;
  padding:7px 8px;
  color:var(--text-faint);
  font-weight:600;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.05em;
  border-bottom:1px solid var(--border);
}
table.almanac td{
  padding:5px 7px;
  text-align:center;
  border-bottom:1px solid var(--border-subtle);
  white-space:nowrap;
}
table.almanac tr:last-child td{ border-bottom:none; }
table.almanac td.rowlabel{
  text-align:left;
  color:var(--text);
  font-weight:500;
}
.cal-cell{
  width:22px; height:22px;
  border-radius:4px;
  display:inline-block;
}
.cal-cell.green{ background:rgba(63,185,138,.5); }
.cal-cell.neutral{ background:#1E2430; }
.cal-cell.red{ background:rgba(224,88,95,.5); }

/* ============================================================
   CATEGORY CARDS
   ============================================================ */
.cat-card{
  cursor:pointer;
  transition:border-color .15s, transform .12s, box-shadow .15s;
}
.cat-card:hover{
  border-color:rgba(78,155,216,.4);
  transform:translateY(-1px);
  box-shadow:0 4px 20px rgba(0,0,0,.35), 0 0 0 1px rgba(78,155,216,.08);
}
.cat-card .toprow{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:10px;
}
.cat-card .name{
  font-size:14.5px;
  font-weight:600;
  color:var(--text);
}
.cat-card .src{
  font-size:10.5px;
  color:var(--text-faint);
  font-family:'IBM Plex Mono',monospace;
  margin-top:3px;
}

/* Score bar */
.scorebar{
  height:3px;
  background:var(--panel-2);
  border-radius:99px;
  margin-top:5px;
  overflow:hidden;
}
.scorebar > div{
  height:100%;
  border-radius:99px;
  transition:width .3s ease;
}

/* Metrics row */
.metrics-row{
  display:flex;
  gap:14px;
  margin-top:12px;
  font-size:11.5px;
}
.metrics-row .m{ flex:1; }
.metrics-row .m .lbl{
  color:var(--text-faint);
  font-size:9.5px;
  text-transform:uppercase;
  letter-spacing:.05em;
  font-weight:600;
}
.metrics-row .m .v{
  font-family:'IBM Plex Mono',monospace;
  font-size:13.5px;
  margin-top:2px;
  font-weight:500;
}
.opp-score-badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:22px;
  font-weight:600;
  letter-spacing:-0.03em;
}

/* ============================================================
   GROUP PAGE
   ============================================================ */
.ghero{
  display:flex;
  align-items:center;
  gap:28px;
  flex-wrap:wrap;
}
.ghero .gstat{ min-width:90px; }
.ghero .gstat .lbl{
  font-size:10px;
  text-transform:uppercase;
  color:var(--text-faint);
  letter-spacing:.06em;
  font-weight:600;
}
.ghero .gstat .v{
  font-family:'IBM Plex Mono',monospace;
  font-size:22px;
  font-weight:600;
  margin-top:3px;
}
.gnarrative{
  font-size:13.5px;
  color:var(--text-dim);
  line-height:1.7;
  max-width:800px;
}

/* Highlight row */
.highlight-row{
  display:flex;
  gap:0;
  flex-wrap:wrap;
}
.hl-item{
  flex:1;
  min-width:140px;
  padding:13px 16px;
  border-right:1px solid var(--border);
}
.hl-item:last-child{ border-right:none; }
.hl-item .lbl{
  font-size:9.5px;
  text-transform:uppercase;
  color:var(--text-faint);
  letter-spacing:.06em;
  font-weight:600;
}
.hl-item .nm{
  font-size:14px;
  font-weight:600;
  margin-top:4px;
  cursor:pointer;
  transition:color .12s;
}
.hl-item .nm:hover{ color:var(--structure); }

/* Heat cells */
.heat-cell{
  width:24px;
  height:16px;
  border-radius:3px;
  margin:0 auto;
}
.heat-cell.h1{ background:rgba(224,88,95,.55); }
.heat-cell.h2{ background:rgba(216,162,61,.4); }
.heat-cell.h3{ background:rgba(100,110,130,.35); }
.heat-cell.h4{ background:rgba(201,162,74,.65); }
.heat-cell.h5{ background:rgba(63,185,138,.75); }

/* Rotation flow */
.rotation-flow{
  display:flex;
  justify-content:space-between;
  font-size:10.5px;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:.06em;
  margin-bottom:10px;
}
.rotation-map{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}
@media (max-width:1000px){ .rotation-map{ grid-template-columns:1fr; } }

.rcol{
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  border-top:2.5px solid var(--stage-color, var(--border));
  background:var(--stage-bg, var(--panel-2));
  padding:12px;
  display:flex;
  flex-direction:column;
  min-height:120px;
  min-width:0;
}
.rcol .rc-label{
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.05em;
}
.rcol .rc-desc{
  font-size:10px;
  color:var(--text-faint);
  margin:3px 0 9px;
}
.rcol .rc-meta{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  color:var(--text-faint);
  margin-bottom:8px;
  padding-bottom:8px;
  border-bottom:1px solid var(--border);
}

/* Rotation legend */
.rotation-legend{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid var(--border);
  font-size:10.5px;
  color:var(--text-dim);
}
.rotation-legend .lg{
  display:flex;
  align-items:center;
  gap:6px;
}
.rotation-legend .dot{
  width:8px;
  height:8px;
  border-radius:50%;
  flex-shrink:0;
}

/* Rotation chip */
.rchip{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11.5px;
  padding:5px 8px;
  margin-bottom:4px;
  background:rgba(255,255,255,.03);
  border-radius:5px;
  cursor:pointer;
  border:1px solid var(--border-subtle);
  transition:border-color .12s;
}
.rchip:hover{ border-color:rgba(78,155,216,.3); }
.rchip .sc{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:11px;
}

.rotation-foot{
  display:flex;
  gap:24px;
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid var(--border);
  font-size:12px;
}
.rotation-foot .rf-col b{
  display:block;
  font-size:10px;
  text-transform:uppercase;
  color:var(--text-faint);
  margin-bottom:7px;
  letter-spacing:.05em;
  font-weight:700;
}

/* Mini card */
.mini-card{
  padding:13px;
  cursor:pointer;
  transition:border-color .12s, transform .1s;
}
.mini-card:hover{
  border-color:rgba(78,155,216,.35);
  transform:translateY(-1px);
}
.mini-card .nm{ font-weight:600; font-size:13px; }
.mini-card .ph{ font-size:11px; color:var(--text-faint); margin:4px 0; }
.mini-card .bot{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:5px;
}

/* Group head (collapsible) */
.grouphead{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 14px;
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  cursor:pointer;
  margin-top:12px;
  font-size:13px;
  font-weight:600;
  transition:border-color .12s;
}
.grouphead:hover{ border-color:rgba(78,155,216,.25); }
.grouphead:first-of-type{ margin-top:0; }
.grouphead .car{
  transition:transform .15s;
  color:var(--text-faint);
  font-size:10px;
}
.grouphead.collapsed .car{ transform:rotate(-90deg); }
.grouphead .n{
  margin-left:auto;
  color:var(--text-faint);
  font-weight:400;
  font-size:11px;
}

/* Master table */
table.master{
  width:100%;
  border-collapse:collapse;
  font-size:12.5px;
  margin-bottom:2px;
}
table.master.collapsed{ display:none; }
table.master th{
  text-align:left;
  padding:8px 10px;
  color:var(--text-faint);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.05em;
  border-bottom:1px solid var(--border);
  font-weight:600;
}
table.master td{
  padding:7px 10px;
  border-bottom:1px solid var(--border-subtle);
  white-space:nowrap;
}
table.master tr:last-child td{ border-bottom:none; }
table.master tr:hover td{
  background:var(--panel-2);
  cursor:pointer;
}

/* Arrows */
.arrow{ font-weight:700; font-size:14px; }
.arrow.up{ color:var(--up); }
.arrow.upright{ color:var(--up); }
.arrow.side{ color:var(--text-dim); }
.arrow.downright{ color:var(--down); }
.arrow.down{ color:var(--down); }

/* Structure pills */
.struct-pill{
  font-size:10.5px;
  padding:2px 9px;
  border-radius:99px;
  font-weight:600;
  font-family:'Inter',sans-serif;
}
.struct-pill.strongbull{ background:rgba(63,185,138,.15); color:var(--up); }
.struct-pill.bull{ background:rgba(63,185,138,.09); color:var(--up); }
.struct-pill.neutral{ background:#1A2030; color:var(--text-dim); }
.struct-pill.weak{ background:rgba(216,162,61,.1); color:var(--warn); }
.struct-pill.oversold{ background:var(--structure-glow); color:var(--structure); }
.struct-pill.overbought{ background:var(--down-glow); color:var(--down); }

/* Exhaustion pills */
.exh-pill{
  font-size:10.5px;
  padding:2px 9px;
  border-radius:99px;
  font-weight:600;
  font-family:'Inter',sans-serif;
}
.exh-pill.none{ background:#1A2030; color:var(--text-faint); }
.exh-pill.early{ background:rgba(216,162,61,.1); color:var(--warn); }
.exh-pill.moderate{ background:rgba(216,162,61,.16); color:var(--warn); }
.exh-pill.high{ background:rgba(224,88,95,.14); color:var(--down); }

/* Generic dot */
.dot{
  display:inline-block;
  width:6px; height:6px;
  border-radius:50%;
  margin-right:5px;
  vertical-align:middle;
}
.dot.green{ background:var(--up); }
.dot.yellow{ background:var(--warn); }
.dot.red{ background:var(--down); }

  border:1px solid rgba(78,155,216,.2);

  border-bottom:1px solid #E2E5EA;

}

  border:1px solid #E2E5EA;
  background:#FFFFFF;
}

  border:none;
  font-size:12px;
  font-weight:600;
  color:var(--text);
  padding-top:14px;
}

  background:#EAF7F1;
  border-color:#B7E4CE;
}
table.journey td.risk{
  background:#FBEBEC;
  border-color:#F0BEC2;
}
.jchip{
  display:inline-block;
  font-size:11px;
  padding:3px 9px;

.jempty{ color:var(--text-faint); font-size:11px; }
.jcorner{

// For categories with no curated business calendar (Broad Market, Market Cap, Strategy, Global Markets):
// classify by ranking this month's mean return against the SAME category's other 11 months — a purely
// quantitative read, kept visually distinct from the curated (fundamental) classification above, never blended.
const STATE_LADDER = ['Weak','Recovery','Normal','Strong','Peak'];
function computedSeasonState(group,name,lookback,historyYears,monthIdx){
  const means = MONTHS.map((m,i)=>({i, mean: seasonStats(group,name,m,lookback,historyYears).mean}));
  const sorted = [...means].sort((a,b)=>a.mean-b.mean);
  const rank = sorted.findIndex(x=>x.i===monthIdx); // 0 (lowest) .. 11 (highest)
  const bucket = Math.min(4, Math.floor(rank/12*5));
  return STATE_LADDER[bucket];
}
function ordinal(n){ const s=['th','st','nd','rd']; const v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
// This month's mean return ranked against the SAME category's other 11 months (1st = highest).
// Used as the rationale for categories with no curated driver, or where the curated read is flat/non-seasonal
// across the year — a quantitative fallback instead of inventing a narrative the business calendar doesn't have.
function monthReturnRank(group,name,lookback,historyYears,monthIdx){
  const means = MONTHS.map((m,i)=>({i, mean: seasonStats(group,name,m,lookback,historyYears).mean}));
  const sorted = [...means].sort((a,b)=>b.mean-a.mean); // 0 = highest mean
  const rank = sorted.findIndex(x=>x.i===monthIdx)+1;
  return `Ranks ${ordinal(rank)} of 12 by mean return`;
}
// A curated entry counts as "flat" (no real curated seasonal signal) if every month maps to the same state —
// e.g. ESG, Innovation, Logistics. For these, showing the same static phrase 12 times adds nothing, so the
// rationale column falls back to the quantitative rank instead.
function isFlatCurated(biz){ return biz && biz.states.every(s=>s===biz.states[0]); }
// Mock stand-in for: collect all historical [month] returns within [lookback] window, compute mean/median/positive%/stddev.
// Replace with real computation once monthly return history is available per category.
// Gracefully caps at whatever history actually exists — never returns N/A/error, matching how a real query would just use fewer observations.
function seasonStats(group,name,month,lookback,historyYears){
  return SEASONALITY_DATA[group]?.[name]?.[month]?.[lookback]
    ?? {mean:0, median:0, positivePct:null, stdDev:null, n:0, effectiveYears:0, capped:false}; // "Insufficient History" fallback
}
// Real: average full calendar-year return over the lookback window, from the pre-fetched ANNUAL_DATA grid.
function annualReturn(group,name,lookback,historyYears){
  return ANNUAL_DATA[group]?.[name]?.[lookback] ?? 0;
}

function buildCategories(){
  const monthIdx = new Date().getMonth();
  CATEGORIES = RAW.map(r=>{
    const [group,name,sourceType,source,history,flag]=r;
    const d = COMPUTED_DATA[group]?.[name] ?? {}; // backend-computed, real -- absent/null fields render as "Insufficient History" via the interp lines below, same as before
    const structure = d.structure ?? null;
    const fundamental = d.fundamental ?? null;
    const trend = d.trend ?? null;
    const cycle = d.cycle ?? null;
    const vol = d.vol ?? null;
    const rsi = d.rsi ?? null;
    const rsiInterp = rsi==null ? 'Insufficient History' : rsi>=70?'Overbought':rsi<=30?'Oversold':'Neutral';
    const smi = d.smi ?? null;
    const smiInterp = smi==null ? 'Insufficient History' : smi>40?'Bullish Cross':smi<-40?'Bearish Cross':'Neutral';
    const atrPct = d.atrPct ?? null;
    const trendPct = d.trendPct ?? null;
    const pivotDist = d.pivotDist ?? null;
    const pivotInterp = pivotDist==null ? 'Insufficient History' : pivotDist>8?'Above R2':pivotDist>2?'Above R1':pivotDist>=-2?'Near Pivot':pivotDist>=-8?'Above S1':'Below S1';
    const opportunity = d.opportunity ?? null; // real structure+business+seasonality blend from opportunity_score.py -- flag==='context'/'currency' already nulled out upstream
    // Master-table derived dimensions -- real, from the backend
    const biz = BUSINESS_CALENDAR[name];
    const season = biz ? biz.states[monthIdx] : computedSeasonState(group, name, 'Max', history, monthIdx); // 'Max' lookback: no per-drawer UI selection exists at boot time, matches architecture doc's fallback definition
    const contra = d.contra ?? null;
    const structLabel = structure==null ? 'Insufficient History' : (STRUCT_LABELS[Math.floor(structure/17)] || STRUCT_LABELS[3]);
    const arrow = d.arrow ?? ['—','side'];       // never null -- every render site does c.arrow[0]/[1] unguarded
    const accel = d.accel ?? ['— No Data','side'];
    const exhaustion = d.exhaustion ?? ['—','none'];
    const posPct = d.posPct ?? null;
    const posInterp = posPct==null ? 'Insufficient History' : posPct>=90?'Near ATH':posPct>=65?'Upper Quartile':posPct>=35?'Middle':posPct>=15?'Lower Quartile':'Near ATL';
    return {group,name,sourceType,source,history,flag,structure,fundamental,trend,cycle,vol,opportunity,
            season,contra,structLabel,arrow,accel,exhaustion,posPct,posInterp,
            rsi,rsiInterp,smi,smiInterp,atrPct,trendPct,pivotDist,pivotInterp};
  });
}

// Unified allocation stance — single source of truth used by Drawer, Group Leaderboard, and Data Explorer
function stanceFor(c){
  if(c.flag==='context') return {label:'Context Instrument', color:'var(--text-dim)'};
  if(c.flag==='currency') return {label:'Currency Context', color:'var(--text-dim)'};
  if(c.opportunity==null) return {label:'Insufficient History', color:'var(--text-dim)'};
  if(c.opportunity>=80) return {label:'Invest', color:'var(--up)'};
  if(c.opportunity>=60) return {label:'Accumulate', color:'var(--up)'};
  if(c.opportunity>=40) return (c.season==='Weak'||c.season==='Recovery') ? {label:'Enter', color:'var(--fundamental)'} : {label:'Hold', color:'var(--warn)'};
  return {label:'Exit', color:'var(--down)'};
}

function refreshLabel(){
  const now=new Date(); const day=now.getDay(); // Friday = 5
  const last=new Date(now); last.setDate(now.getDate()-((day+2)%7)); last.setHours(20,0,0,0);
  const next=new Date(last); next.setDate(last.getDate()+7);
  const fmt=d=>d.toLocaleString('en-US',{day:'2-digit',month:'short',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true});
  return `Last updated: ${fmt(last)} EST (weekly full run) · next update ${fmt(next)} EST`;
}

function renderGroupPage(gid){
  const meta = GROUP_META[gid];
  const cats = CATEGORIES.filter(c=>c.group===gid);
  const scored = cats.filter(c=>c.opportunity!==null);

  const bestOpp = [...scored].sort((a,b)=>b.opportunity-a.opportunity)[0];
  const bestTrend = [...cats].sort((a,b)=>b.structure-a.structure)[0];
  const bestMomentum = [...cats].filter(c=>c.accel[1]==='up').sort((a,b)=>b.structure-a.structure)[0] || bestTrend;
  const bestContra = [...cats].sort((a,b)=>b.contra-a.contra)[0];
  const worstExh = [...cats].sort((a,b)=>(b.exhaustion[1]==='high'?1:0)-(a.exhaustion[1]==='high'?1:0)||b.structure-a.structure)[0];
  const mostImproved = [...cats].sort((a,b)=>seedRand('wk'+a.name)()-seedRand('wk'+b.name)())[0];

  // Capital Rotation Map — one stage per category, horizontal flow, no scatter
  function stage(c){
    if(c.exhaustion[1]==='high') return 'Exhaustion';
    if(c.season==='Peak' && c.structure>=55) return 'Mature';
    if(c.structure>=60) return 'Leadership';
    if(c.structure<40 && (c.season==='Weak'||c.season==='Recovery')) return 'Contra';
    return 'Recovery';
  }
  const STAGE_META = {
    Contra:{color:'#4E9BD8', desc:'Best Early Entry', legend:'Blue — fundamentals & tape both out of favor, earliest entry window'},
    Recovery:{color:'#9B8CE0', desc:'Building Momentum', legend:'Violet — improving breadth, technical confirmation beginning'},
    Leadership:{color:'#3FB98A', desc:'Strong Trend', legend:'Green — confirmed trend, strong participation'},
    Mature:{color:'#D8A23D', desc:'Hold', legend:'Amber — late-cycle, momentum still positive but stretched'},
    Exhaustion:{color:'#E0585F', desc:'Reduce', legend:'Red — momentum fading, higher reversal risk'},
  };
  const STAGES = ['Contra','Recovery','Leadership','Mature','Exhaustion'];
  const staged = STAGES.map(s=>{
    const scats = cats.filter(c=>stage(c)===s);
    const withScore = scats.filter(c=>c.opportunity!==null);
    const avgO = withScore.length ? Math.round(withScore.reduce((a,c)=>a+c.opportunity,0)/withScore.length) : null;
    return {stage:s, cats:scats, avgO, stars: avgO!==null ? Math.min(5,Math.max(1,Math.round(avgO/20))) : 0};
  });
  const likelyUp = [...cats].filter(c=>c.accel[1]==='up' && c.structure<75).sort((a,b)=>b.structure-a.structure).slice(0,3);
  const likelyDown = [...cats].filter(c=>c.accel[1]==='down' || c.exhaustion[1]==='high').sort((a,b)=>b.structure-a.structure).slice(0,3);

  function actionFor(c){ return c.opportunity===null ? '—' : stanceFor(c).label; }
  const ACTION_PRIORITY = {Enter:0, Invest:1, Accumulate:2, Hold:3, Exit:4};
  const leaderboard = [...scored].sort((a,b)=> (ACTION_PRIORITY[actionFor(a)]-ACTION_PRIORITY[actionFor(b)]) || (b.contra-a.contra) || (b.opportunity-a.opportunity));

  document.getElementById(`page-${gid}`).innerHTML = `
    <div class="pagehead"><h1>${meta.label}</h1></div>

    <div class="section-title" style="margin-top:0;"><h2>Group Highlights</h2></div>
    <div class="card highlight-row">
      <div class="hl-item"><div class="lbl">Best Opportunity</div><div class="nm" onclick="openDrawer('${gid}','${bestOpp.name.replace(/'/g,"\\'")}')">${bestOpp.name}</div></div>
      <div class="hl-item"><div class="lbl">Best Trend</div><div class="nm" onclick="openDrawer('${gid}','${bestTrend.name.replace(/'/g,"\\'")}')">${bestTrend.name}</div></div>
      <div class="hl-item"><div class="lbl">Best Momentum</div><div class="nm" onclick="openDrawer('${gid}','${bestMomentum.name.replace(/'/g,"\\'")}')">${bestMomentum.name}</div></div>
      <div class="hl-item"><div class="lbl">Best Contra</div><div class="nm" onclick="openDrawer('${gid}','${bestContra.name.replace(/'/g,"\\'")}')">${bestContra.name}</div></div>
      <div class="hl-item"><div class="lbl">Highest Exhaustion</div><div class="nm" onclick="openDrawer('${gid}','${worstExh.name.replace(/'/g,"\\'")}')">${worstExh.name}</div></div>
      <div class="hl-item"><div class="lbl">Most Improved</div><div class="nm" onclick="openDrawer('${gid}','${mostImproved.name.replace(/'/g,"\\'")}')">${mostImproved.name}</div></div>
    </div>

    <div class="section-title"><h2>Seasonality Calendar</h2><span class="sub">Business (curated, slow-moving) alongside Mean/Median/Positive%/Std Dev (computed from price history) — two different methodologies, shown side by side, never blended</span></div>
    <div class="card">
      <div class="explorer-toolbar" style="margin-bottom:14px;">
        <select id="seasonMonth-${gid}">${MONTHS.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}</select>
        <select id="seasonLookback-${gid}">${LOOKBACKS.map(l=>`<option value="${l}">${l==='Max'?'Max History':l+(l===1?' Year':' Years')}</option>`).join('')}</select>
        <span style="font-size:11px;color:var(--text-faint);align-self:center;">Stats auto-cap to whatever history a category actually has · click a column to sort</span>
      </div>
      <div style="overflow-x:auto;">
      <table class="explorer">
        <thead><tr id="seasonHeadRow-${gid}">
          <th data-k="name">Category</th><th data-k="business">Business</th><th data-k="rationale" title="Curated driver behind this month's Business state. For categories with no curated read, or a curated read that's flat/non-seasonal all year (ESG, Innovation, Logistics), this shows where the month ranks by mean return instead.">Rationale</th><th data-k="mean">Mean Return</th><th data-k="median">Median Return</th><th data-k="positive">Positive %</th><th data-k="stddev">Std Dev</th><th data-k="annual" title="CAGR over the full lookback period — same regardless of month selected">Annual Return<br><span style="font-size:9px;font-weight:400;text-transform:none;color:var(--text-faint);">CAGR, period-only</span></th>
        </tr></thead>
        <tbody id="seasonBody-${gid}"></tbody>
      </table>
      </div>
    </div>

    <div class="section-title"><h2>Capital Rotation Map</h2><span class="sub">If deploying fresh capital today, where should it go?</span></div>
    <div class="card">
      <div class="rotation-flow"><span>← Early Entry</span><span>Take Profits →</span></div>
      <div class="rotation-map">
        ${staged.map(s=>`
          <div class="rcol" style="--stage-color:${STAGE_META[s.stage].color};--stage-bg:${STAGE_META[s.stage].color}14;">
            <div class="rc-label" style="color:${STAGE_META[s.stage].color}">${s.stage}</div>
            <div class="rc-desc">${STAGE_META[s.stage].desc}</div>
            <div class="rc-meta"><span>${s.cats.length} categories</span><span>Avg ${s.avgO??'—'}</span></div>
            ${s.cats.length? s.cats.map(c=>`<div class="rchip" onclick="openDrawer('${gid}','${c.name.replace(/'/g,"\\'")}')"><span>${c.name}</span><span class="sc arrow ${c.arrow[1]}" style="color:${c.opportunity===null?'var(--text-faint)':scoreColor(c.opportunity)}">${c.opportunity??'—'} ${c.arrow[0]}</span></div>`).join('') : '<span class="jempty">—</span>'}
          </div>`).join('')}
      </div>
      <div class="rotation-legend">
        ${STAGES.map(s=>`<div class="lg"><span class="dot" style="background:${STAGE_META[s].color};"></span>${STAGE_META[s].legend}</div>`).join('')}
      </div>
      <div class="rotation-foot">
        <div class="rf-col"><b>↑ Likely Moving Up</b>${likelyUp.map(c=>`<div class="jchip" onclick="openDrawer('${gid}','${c.name.replace(/'/g,"\\'")}')" style="color:var(--up);">${c.name}</div>`).join('')||'<span class="jempty">—</span>'}</div>
        <div class="rf-col"><b>↓ Likely Moving Down</b>${likelyDown.map(c=>`<div class="jchip" onclick="openDrawer('${gid}','${c.name.replace(/'/g,"\\'")}')" style="color:var(--down);">${c.name}</div>`).join('')||'<span class="jempty">—</span>'}</div>
      </div>
    </div>

    <div class="section-title"><h2>Category Leaderboard</h2><span class="sub">Contra-first — early entries surface before crowded trades</span></div>
    <table class="explorer" style="margin-bottom:26px;">
      <thead><tr><th>Category</th><th>Phase</th><th>Contra</th><th>Opportunity</th><th>Action</th></tr></thead>
      <tbody>
        ${leaderboard.map(c=>`<tr onclick="openDrawer('${gid}','${c.name.replace(/'/g,"\\'")}')">
          <td style="font-weight:600;">${c.name}</td>
          <td style="color:var(--text-dim)">${c.season}</td>
          <td class="stars" style="color:var(--fundamental)">${stars(c.contra)}</td>
          <td class="mono" style="color:${scoreColor(c.opportunity)}">${c.opportunity}</td>
          <td>${actionFor(c)}</td>
        </tr>`).join('')}
      </tbody>
    </table>

    <div class="section-title"><h2>Categories</h2><span class="sub">${cats.length} tracked · click to open full research report</span></div>
    <div class="grid cols-4">
      ${cats.map(c=>`
        <div class="card mini-card" onclick="openDrawer('${gid}','${c.name.replace(/'/g,"\\'")}')">
          <div class="nm">${c.name}</div>
          <div class="ph">${c.season}</div>
          <div class="bot"><span class="stars">${stars(c.fundamental)}</span><span class="mono" style="font-weight:600;color:${c.opportunity===null?'var(--text-faint)':scoreColor(c.opportunity)}">${c.opportunity===null?'—':c.opportunity}</span></div>
        </div>`).join('')}
    </div>
  `;

  // Seasonality Calendar wiring — mock stats now, swap seasonStats() for a real query later
  const monthSel = document.getElementById(`seasonMonth-${gid}`);
  const lookbackSel = document.getElementById(`seasonLookback-${gid}`);
  const seasonBody = document.getElementById(`seasonBody-${gid}`);
  let seasonSort = {key:'name', dir:1};
  document.getElementById(`seasonHeadRow-${gid}`).addEventListener('click', e=>{
    const th = e.target.closest('th'); if(!th) return;
    const k = th.dataset.k;
    seasonSort.dir = (seasonSort.key===k) ? -seasonSort.dir : -1;
    seasonSort.key = k;
    drawSeason();
  });
  function drawSeason(){
    const monthIdx = Number(monthSel.value);
    const month = MONTHS[monthIdx];
    const lookback = lookbackSel.value;
    let rows = cats.map(c=>{
      const s = seasonStats(c.group, c.name, month, lookback, c.history);
      const ann = annualReturn(c.group, c.name, lookback, c.history);
      const biz = BUSINESS_CALENDAR[c.name];
      const bizState = biz ? biz.states[monthIdx] : computedSeasonState(c.group, c.name, lookback, c.history, monthIdx);
      // Rationale: curated driver text when the curated calendar actually says something month-specific;
      // otherwise (no curated entry, or a curated entry that's flat/non-seasonal all year) fall back to
      // the quantitative rank so the column never states a narrative the data doesn't support.
      const flat = isFlatCurated(biz);
      const rank = monthReturnRank(c.group, c.name, lookback, c.history, monthIdx);
      let rationale, rationaleIcon, rationaleTitle;
      if(biz && !flat){
        rationale = biz.why[monthIdx];
        rationaleIcon = CONF_ICON[biz.confidence];
        rationaleTitle = `Curated — ${biz.confidence} confidence`;
      } else if(biz && flat){
        rationale = `${biz.why[monthIdx]} · ${rank}`;
        rationaleIcon = '📊';
        rationaleTitle = `Curated read is flat/non-seasonal all year — ranked by mean return instead`;
      } else {
        rationale = rank;
        rationaleIcon = '📊';
        rationaleTitle = `No curated industry read — this month's return ranked against this category's other 11 months`;
      }
      return {c, s, ann, biz, bizState, rationale, rationaleIcon, rationaleTitle};
    });
    rows.sort((a,b)=>{
      const k = seasonSort.key;
      const va = k==='name' ? a.c.name : k==='business' ? BUSINESS_RANK[a.bizState] : k==='rationale' ? a.rationale : k==='positive' ? a.s.positivePct : k==='stddev' ? a.s.stdDev : k==='annual' ? a.ann : a.s[k];
      const vb = k==='name' ? b.c.name : k==='business' ? BUSINESS_RANK[b.bizState] : k==='rationale' ? b.rationale : k==='positive' ? b.s.positivePct : k==='stddev' ? b.s.stdDev : k==='annual' ? b.ann : b.s[k];
      if(typeof va==='string') return seasonSort.dir * va.localeCompare(vb);
      return seasonSort.dir * (vb - va);
    });
    seasonBody.innerHTML = rows.map(({c,s,ann,biz,bizState,rationale,rationaleIcon,rationaleTitle})=>`
      <tr onclick="openDrawer('${gid}','${c.name.replace(/'/g,"\\'")}')">
        <td style="font-weight:600;">${c.name}</td>
        <td><span style="color:${BUSINESS_COLOR[bizState]};font-weight:600;">${bizState}</span></td>
        <td style="color:var(--text-dim);font-size:12px;max-width:260px;"><span style="font-size:10px;" title="${rationaleTitle}">${rationaleIcon}</span> ${rationale}</td>
        <td class="mono" style="color:${s.mean>=0?'var(--up)':'var(--down)'}">${s.mean>0?'+':''}${s.mean}%</td>
        <td class="mono" style="color:var(--text-dim)">${s.median>0?'+':''}${s.median}%</td>
        <td class="mono">${s.positivePct}%</td>
        <td class="mono" style="color:var(--text-dim)">${s.n<=1?'—':s.stdDev+'%'}</td>
        <td class="mono" style="color:${ann>=0?'var(--up)':'var(--down)'}">${ann>0?'+':''}${ann}%${s.capped?` <span style="color:var(--text-faint);font-size:10px;" title="Only ${s.effectiveYears}y of history available — using max available instead of requested lookback">(${s.effectiveYears}y avail)</span>`:''}</td>
      </tr>`).join('');
  }
  monthSel.addEventListener('change', drawSeason);
  lookbackSel.addEventListener('change', drawSeason);
  monthSel.value = new Date().getMonth();
  drawSeason();
}

function renderExplorer(){
  const container = document.getElementById('page-explorer');
  container.innerHTML = `
    <div class="pagehead"><h1>Data Explorer</h1><p>Every calculated indicator for all ${CATEGORIES.length} categories, plus the resulting inference (Invest / Accumulate / Enter / Hold / Exit). Sort, filter, export.</p></div>
    <div class="explorer-toolbar">
      <select id="fltGroup"><option value="">All Groups</option>${GROUPS.filter(g=>!['summary','explorer'].includes(g.id)).map(g=>`<option value="${g.id}">${g.label}</option>`).join('')}</select>
      <input class="filter" id="fltSearch" placeholder="Filter by category name…">
      <select id="fltSeason"><option value="">All Seasons</option>${SEASONS.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
      <select id="fltStruct"><option value="">All Structure</option>${STRUCT_LABELS.map(s=>`<option value="${s[1]}">${s[0]}</option>`).join('')}</select>
      <select id="fltExh"><option value="">All Exhaustion</option>${EXH_LEVELS.map(e=>`<option value="${e[1]}">${e[0]}</option>`).join('')}</select>
      <select id="fltConf"><option value="">All Confidence</option><option value="high">High (≥3yr)</option><option value="med">Below Floor</option></select>
      <span style="font-size:11px;color:var(--text-faint);align-self:center;">Click any column header to sort ↕</span>
    </div>
    <div style="overflow-x:auto;">
    <table class="explorer" style="min-width:2000px;">
      <thead><tr id="explHeadRow">
        <th data-k="name">Category</th><th data-k="group">Group</th><th data-k="season">Season</th><th data-k="fundamental">Fundamental</th><th data-k="structure">Technical Score</th><th data-k="trendPct">Trend</th><th data-k="rsi">RSI(14w)</th><th data-k="smi">SMI</th><th data-k="cycle">Cycle</th><th data-k="posPct">Position</th><th data-k="atrPct">ATR/Vol</th><th data-k="pivotDist">Pivot</th><th data-k="contra">Contra</th><th data-k="accel">Accel.</th><th data-k="exhaustion">Exhaustion</th><th data-k="opportunity">Opportunity</th><th data-k="inference">Inference</th><th data-k="history">History</th><th data-k="confidence">Confidence</th>
      </tr></thead>
      <tbody id="explorerBody"></tbody>
    </table>
  </div>
  `;
  const body = document.getElementById('explorerBody');
  const SEASON_RANK={'Weak':0,'Recovery':1,'Normal':2,'Strong':3,'Peak':4};
  const CYCLE_RANK=Object.fromEntries(CYCLES.map((c,i)=>[c,i]));
  const EXH_RANK=Object.fromEntries(EXH_LEVELS.map((e,i)=>[e[1],i]));
  const CONF_RANK=c=>c.history>=3?1:0;
  let sortKey='opportunity', sortDir=-1;
  document.getElementById('explHeadRow').addEventListener('click',e=>{
    const th=e.target.closest('th'); if(!th) return;
    const k=th.dataset.k;
    sortDir = (sortKey===k) ? -sortDir : -1;
    sortKey=k;
    document.querySelectorAll('#explHeadRow th').forEach(h=>h.style.color='');
    th.style.color='var(--structure)';
    draw();
  });
  function sortVal(c,k){
    switch(k){
      case 'name': return c.name;
      case 'group': return GROUP_META[c.group].label;
      case 'season': return SEASON_RANK[c.season];
      case 'cycle': return CYCLE_RANK[c.cycle];
      case 'exhaustion': return EXH_RANK[c.exhaustion[1]];
      case 'accel': return c.accel[1]==='up'?1:c.accel[1]==='side'?0:-1;
      case 'inference': return stanceFor(c).label;
      case 'confidence': return CONF_RANK(c);
      case 'opportunity': return c.opportunity??-1;
      default: return c[k];
    }
  }
  function draw(){
    let rows=[...CATEGORIES];
    const g=document.getElementById('fltGroup').value;
    const s=document.getElementById('fltSearch').value.toLowerCase();
    const season=document.getElementById('fltSeason').value;
    const struct=document.getElementById('fltStruct').value;
    const exh=document.getElementById('fltExh').value;
    const conf=document.getElementById('fltConf').value;
    if(g) rows=rows.filter(r=>r.group===g);
    if(s) rows=rows.filter(r=>r.name.toLowerCase().includes(s));
    if(season) rows=rows.filter(r=>r.season===season);
    if(struct) rows=rows.filter(r=>r.structLabel[1]===struct);
    if(exh) rows=rows.filter(r=>r.exhaustion[1]===exh);
    if(conf==='high') rows=rows.filter(r=>r.history>=3);
    if(conf==='med') rows=rows.filter(r=>r.history<3);
    rows.sort((a,b)=>{
      const va=sortVal(a,sortKey), vb=sortVal(b,sortKey);
      if(typeof va==='string') return sortDir * va.localeCompare(vb);
      return sortDir * ((vb??-1)-(va??-1));
    });
    body.innerHTML = rows.map(c=>{ const st=stanceFor(c); const vi=(v,i)=>`<td class="mono">${v}<br><span style="color:var(--text-faint);font-size:10px;font-family:'Inter',sans-serif;">${i}</span></td>`; return `
      <tr onclick="openDrawer('${c.group}','${c.name.replace(/'/g,"\\'")}')">
        <td style="font-weight:600;">${c.name}</td>
        <td style="color:var(--text-dim)">${GROUP_META[c.group].label}</td>
        <td style="color:var(--text-dim)">${c.season}</td>
        <td class="stars">${stars(c.fundamental)}</td>
        <td class="mono" style="font-weight:600;color:${scoreColor(c.structure)}">${c.structure}</td>
        ${vi((c.trendPct>0?'+':'')+c.trendPct+'%', c.trend)}
        ${vi(c.rsi, c.rsiInterp)}
        ${vi(c.smi, c.smiInterp)}
        <td style="color:var(--text-dim)">${c.cycle}</td>
        ${vi(c.posPct+'th', c.posInterp)}
        ${vi(c.atrPct+'%', c.vol)}
        ${vi((c.pivotDist>0?'+':'')+c.pivotDist+'%', c.pivotInterp)}
        <td class="stars" style="color:var(--fundamental)">${stars(c.contra)}</td>
        <td class="arrow ${c.accel[1]}">${c.accel[0].split(' ')[0]}</td>
        <td><span class="exh-pill ${c.exhaustion[1]}">${c.exhaustion[0]}</span></td>
        <td class="mono" style="color:${c.opportunity===null?'var(--text-faint)':scoreColor(c.opportunity)}">${c.opportunity===null?'—':c.opportunity}</td>
        <td style="font-weight:600;color:${st.color}">${st.label}</td>
        <td class="mono">${c.history}y</td>
        <td><span class="badge-conf ${c.history>=3?'high':'med'}">${c.history>=3?'High':'Below Floor'}</span></td>
      </tr>`;}).join('');
  }
  ['fltGroup','fltSearch','fltSeason','fltStruct','fltExh','fltConf'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
  draw();
}

/* ---------- DRAWER (category detail — mirrors etf.html spec) ---------- */
function openDrawer(group,name){
  const c = CATEGORIES.find(x=>x.group===group && x.name===name);
  if(!c) return;
  const factors = c.flag==='context'
    ? [['Position (percentile in 5Y range)', c.posPct],['Cycle (fear/complacency)', c.cycle]]
    : [['Trend', `${c.trendPct>0?'+':''}${c.trendPct}% · ${c.trend}`],['Cycle', c.cycle],['Position', `${c.posPct}th pct · ${c.posInterp}`],['RSI (14w)', `${c.rsi} · ${c.rsiInterp}`],['SMI', `${c.smi} · ${c.smiInterp}`],['ATR / Volatility', `${c.atrPct}% · ${c.vol}`],['Pivot', `${c.pivotDist>0?'+':''}${c.pivotDist}% · ${c.pivotInterp}`]];
  const stance = stanceFor(c);

  document.getElementById('drawer').innerHTML = `
    <div class="drawer-close" onclick="closeDrawer()">✕</div>
    <div style="margin-bottom:6px;"><span class="pill" style="background:${stance.color}22;color:${stance.color};border-color:${stance.color}44;">${stance.label}</span></div>
    <h2 style="font-size:22px;margin:5px 0 2px;letter-spacing:0.01em;">${c.name}</h2>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);margin-bottom:22px;">${c.sourceType} · ${c.source} · ${c.history}y history</div>

    <div class="drawer-section-label" style="color:var(--fundamental);">Fundamental Intelligence</div>
    <div class="stars" style="font-size:20px;letter-spacing:3px;">${stars(c.fundamental)}</div>

    <div style="height:1px;background:var(--border-subtle);margin:20px 0;"></div>

    <div class="drawer-section-label" style="color:var(--structure);">Weekly Market Structure</div>
    ${factors.map(f=>`<div class="factor-row"><span class="fname">${f[0]}</span><span class="fval">${f[1]}</span></div>`).join('')}

    ${c.opportunity!==null ? `
    <div style="height:1px;background:var(--border-subtle);margin:20px 0;"></div>
    <div class="drawer-section-label" style="color:var(--text-faint);">Opportunity Score</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:36px;font-weight:600;color:${scoreColor(c.opportunity)};letter-spacing:-0.03em;line-height:1;">${c.opportunity}</div>
    <div class="decision-tag" style="background:${stance.color}18;color:${stance.color};margin-top:8px;">${stance.label}</div>
    <ul class="explain-list" style="margin-top:14px;">
      <li>Trend ${c.trend.toLowerCase()} on weekly 18w/40w structure</li>
      <li>Cycle confirmed ${c.cycle} (3-week anti-whipsaw lag applied)</li>
      <li>Position at ${c.posPct}th percentile of 5Y range</li>
      <li>Volatility regime: ${c.vol.toLowerCase()}</li>
      <li>Score reflects Market Structure only — Fundamentals shown separately above</li>
    </ul>
    ` : `<div style="font-size:12.5px;color:var(--text-dim);margin-top:20px;padding:14px;background:var(--panel-2);border-radius:var(--radius-sm);border:1px solid var(--border);">Opportunity Score suppressed for context instruments — this card exists to inform reading of other categories, not as a standalone allocation decision.</div>`}

    <div class="footnote">Data confidence: ${c.history>=3?'High':'Below 3yr floor — flagged in Emerging Opportunities'}.</div>
  `;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

/* ---------- ROUTER ---------- */
function navigate(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.navlist a').forEach(a=>a.classList.remove('active'));
  const page = document.getElementById(`page-${id}`);
  if(page) page.classList.add('active');
  const link = document.querySelector(`[data-nav="${id}"]`);
  if(link) link.classList.add('active');
  const label = GROUPS.find(g=>g.id===id)?.label || 'Summary';
  document.getElementById('crumb').innerHTML = `IndiaPulse / <b>${label}</b> <span id="refreshLabel" style="color:var(--text-faint);font-size:11px;margin-left:10px;">${refreshLabel()}</span>`;
  if(id==='summary' && !page.dataset.rendered){ renderSummary(); page.dataset.rendered='1'; }
  if(GROUP_META[id] && !page.dataset.rendered){ renderGroupPage(id); page.dataset.rendered='1'; }
  if(id==='explorer' && !page.dataset.rendered){ renderExplorer(); page.dataset.rendered='1'; }
}

async function boot(){
  try{
    const [computed, seasonality, annual] = await Promise.all([
      fetch('/data/computed.json').then(r=>r.json()),
      fetch('/data/seasonality.json').then(r=>r.json()),
      fetch('/data/annual.json').then(r=>r.json()),
    ]);
    COMPUTED_DATA = computed; SEASONALITY_DATA = seasonality; ANNUAL_DATA = annual;
  }catch(e){
    // Fetch failed (e.g. local file:// preview, or a bad deploy) -- fall back to empty grids
    // rather than a blank page. Every field already has an "Insufficient History" fallback
    // path built into buildCategories()/seasonStats()/annualReturn(), so this degrades to
    // an all-"Insufficient History" render instead of crashing.
    console.error('IndiaPulse: failed to load computed data, rendering with empty grids', e);
  }

  buildCategories();

  const pagesEl = document.getElementById('pages');
  GROUPS.forEach(g=>{
    pagesEl.insertAdjacentHTML('beforeend', `<div class="page" id="page-${g.id}"></div>`);
  });
  window.addEventListener('hashchange', ()=>navigate(location.hash.slice(1)||'summary'));
  navigate(location.hash.slice(1)||'summary');

  document.getElementById('globalSearch').addEventListener('keydown', e=>{
    if(e.key==='Enter'){ location.hash='explorer'; setTimeout(()=>{ const f=document.getElementById('fltSearch'); if(f){f.value=e.target.value; f.dispatchEvent(new Event('input'));} },50); }
  });
}
boot();
</script>
