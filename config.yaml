# IndiaPulse configuration
project:
  name: IndiaPulse
  timezone: Asia/Kolkata

paths:
  universe_dir: data/universe
  historical_dir: data/historical
  json_dir: json
  log_dir: docs/logs
  manual_dir: data/manual

download:
  default_period: "10y"
  default_interval: "1d"
  max_retries: 3
  retry_backoff_seconds: 5
  request_timeout: 30
  rate_limit_sleep: 1.0

opportunity_weights:
  seasonality: 0.35
  macro_cycle: 0.30
  momentum: 0.20
  valuation: 0.15

indicators:
  sma_periods: [20, 50, 100, 200]
  ema_periods: [20, 50]
  rsi_period: 14
  atr_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  roc_period: 21

seasonality:
  min_years: 5
  outlier_std_threshold: 2.5

logging:
  level: INFO
  file: docs/logs/indiapulse.log
